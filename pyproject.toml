[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-adaptive-sampling"
version = "0.1.0"
description = "Geometry-aware primal-dual adaptive sampling research prototype for linear programming"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nick Grebe" }
]
keywords = [
  "linear-programming",
  "optimization",
  "adaptive-sampling",
  "active-set",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
pdlp = [
  "ortools==9.15.6755",
  "highspy==1.14.0",
]
gpu = [
  "torch>=2.4",
]
numba = [
  "numba>=0.60",
]
parallel = [
  "torch>=2.4",
  "numba>=0.60",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
